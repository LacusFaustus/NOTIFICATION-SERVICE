name: Security Scan

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Добавляем условие для разных событий
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4
        with:
          # Для push событий указываем base_ref и head_ref явно
          ref: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.head.sha }}

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          # Явно указываем ссылки для push событий
          base-ref: ${{ github.event_name == 'push' && 'HEAD~1' || github.base_ref }}
          head-ref: ${{ github.event_name == 'push' && github.ref || github.head_ref }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
