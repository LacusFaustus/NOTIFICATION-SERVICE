name: Security Scan

on:
  pull_request:
    branches: [ main, master ]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          base-ref: ${{ github.base_ref }}
          head-ref: ${{ github.head_ref }}
