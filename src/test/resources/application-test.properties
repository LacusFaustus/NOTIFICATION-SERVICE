# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=false

# Disable external dependencies for tests
spring.rabbitmq.enabled=false
spring.mail.host=localhost
spring.mail.port=1025

# Security configuration for tests
security.basic.enabled=false

# Logging
logging.level.com.notificationservice=INFO
logging.level.org.springframework=WARN

# Test-specific properties
notification.email.test-mode=true

# Exclude messaging components in tests
test.exclude-messaging=true
