spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  mail:
    host: localhost
    port: 1025

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      enabled: true

logging:
  level:
    com.notificationservice: INFO
    org.springframework: WARN
    org.hibernate: ERROR

notification:
  email:
    test-mode: true
